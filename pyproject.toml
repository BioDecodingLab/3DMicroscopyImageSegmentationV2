[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "src"
version = "0.0.1"
description = "Deep learning segmentation of tubular structures in 3D microscopy images."
authors = [
  { name = "Your name (or your organization/company/team)" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",

]
requires-python = "~=3.10.0"
dependencies = [
    "typer",
    "patchify",
    "loguru",
    "tifffile",
    "dotenv",
    "tensorflow[and-cuda]",
    "scikit-learn",
    "opencv-python",
    "scikit-image",
    "albumentations",
    "pandas",
    "seaborn",
    "notebook",
    "tqdm",
]


[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true
