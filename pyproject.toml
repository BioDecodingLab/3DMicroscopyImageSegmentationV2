[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "src"
version = "2.1.0"
description = "Deep learning segmentation of tubular structures in 3D microscopy images."
authors = [
  { name = "Your name (or your organization/company/team)" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]
requires-python = "~=3.10.0"
dependencies = [
    "typer",
    "patchify",
    "loguru",
    "tifffile",
    "dotenv",
    # Lower bound 2.16: code uses tf.keras.utils.PyDataset (Keras 3, added in 2.16).
    # Upper bound <2.18: from 2.18 onward `tensorflow[and-cuda]` stops auto-detecting the
    # GPU on WSL (it cannot dlopen the bundled CUDA wheels) and falls back to CPU.
    "tensorflow[and-cuda]>=2.16,<2.18",
    "scikit-learn",
    "opencv-python",
    # Floor avoids a pip backtracking trap: without it the resolver can wander to an
    # ancient scikit-image sdist (0.17.2) that has no cp310 wheel and fails to build.
    "scikit-image>=0.24",
    "albumentations",
    "pandas",
    "seaborn",
    "notebook",
    "tqdm",
]


[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true
